name: WebestenHeater 24 APK

on:
  push:
    branches: [ main ]
    paths:
      - "WebestenHeater_24/**"
      - ".github/workflows/webesten24.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore WebestenHeater 24 source
        run: |
          echo "Restoring source archive..."
          base64 -d WebestenHeater_24/source_min/01.b64 > /tmp/WebestenHeater_24_source.zip
          unzip -q /tmp/WebestenHeater_24_source.zip -d /tmp/restored
          test -f /tmp/restored/WebestenHeater_24/app/src/main/AndroidManifest.xml
          rm -rf WebestenHeater_24
          mv /tmp/restored/WebestenHeater_24 WebestenHeater_24
          find WebestenHeater_24/app/src/main/java -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: WebestenHeater_24
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebestenHeater_24_APK
          path: WebestenHeater_24/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
