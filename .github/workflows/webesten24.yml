name: WebestenHeater 24 APK

on:
  push:
    branches: [ main ]
    paths:
      - "WebestenHeater_24/**"
      - ".github/workflows/webesten24.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: WebestenHeater_24
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebestenHeater_24_APK
          path: WebestenHeater_24/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
