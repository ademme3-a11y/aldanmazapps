name: WebestenHeater 24 APK

on:
  push:
    branches: [ main ]
    paths:
      - "WebestenHeater_24/**"
      - ".github/workflows/webesten24.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore complete WebestenHeater 24 project
        run: |
          set -e
          test -f WebestenHeater_24/WebestenHeater_24.zip
          rm -rf /tmp/restored
          mkdir -p /tmp/restored
          unzip -q WebestenHeater_24/WebestenHeater_24.zip -d /tmp/restored
          test -f /tmp/restored/WebestenHeater_24/app/src/main/AndroidManifest.xml
          test -f /tmp/restored/WebestenHeater_24/app/src/main/java/com/aldanmaz/webestenheater/MainActivity.kt
          rm -rf WebestenHeater_24
          mv /tmp/restored/WebestenHeater_24 WebestenHeater_24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        working-directory: WebestenHeater_24
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebestenHeater_24_APK
          path: WebestenHeater_24/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
