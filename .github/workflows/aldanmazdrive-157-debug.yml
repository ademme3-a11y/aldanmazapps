name: Aldanmaz Drive 157 Debug Build

on:
  push:
    branches: [main]
    paths:
      - 'Desktop/AldanmazDrive_147_github_hazir/**'
      - '.github/workflows/aldanmazdrive-157-debug.yml'
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Desktop/AldanmazDrive_147_github_hazir
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure stable debug signing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure TomTom API key
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          test -n "$TOMTOM_API_KEY" || { echo "TOMTOM_API_KEY secret is missing."; exit 1; }
          printf 'TOMTOM_API_KEY=%s\n' "$TOMTOM_API_KEY" > local.properties
          echo "TomTom API key is present (value is not printed)."

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../AldanmazDrive_157.apk

      - name: Create source ZIP
        run: zip -r ../AldanmazDrive_157.zip . -x '.gradle/*' 'app/build/*' '**/.DS_Store' 'local.properties'

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_157_APK
          path: Desktop/AldanmazDrive_157.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_157_ZIP
          path: Desktop/AldanmazDrive_157.zip
          if-no-files-found: error
          retention-days: 30
