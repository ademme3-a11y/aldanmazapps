name: Aldanmaz Drive 1710261751-1 Live Follow Driver ID Parsing Fix

on:
  push:
    branches: [feature/live-follow-147-preserved]
    paths:
      - 'Desktop/AldanmazDrive_147_github_hazir/**'
      - '.github/workflows/aldanmazdrive-live-follow-147.yml'
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Desktop/AldanmazDrive_147_github_hazir
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify permanent signing key
        run: |
          test -s app/aldanmaz-debug.keystore || { echo "Permanent signing keystore is missing."; exit 1; }
          keytool -list -keystore app/aldanmaz-debug.keystore -storepass android -alias androiddebugkey >/dev/null
      - name: Configure speed limit API keys
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM2 }}
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
        run: |
          test -n "$TOMTOM_API_KEY" || { echo "TOMTOM2 secret is missing."; exit 1; }
          printf 'TOMTOM_API_KEY=%s\n' "$TOMTOM_API_KEY" > local.properties
          if [ -n "$HERE_API_KEY" ]; then
            printf 'HERE_API_KEY=%s\n' "$HERE_API_KEY" >> local.properties
            echo "TomTom and HERE keys are configured."
          else
            echo "::warning::HERE_API_KEY secret is missing; HERE provider code is preserved but will not return results until the secret is configured."
          fi
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK signing
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Copy uniquely named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../AldanmazDrive_1710261751-1.apk
      - name: Create source ZIP
        run: zip -r ../AldanmazDrive_1710261751-1.zip . -x '.gradle/*' 'app/build/*' '**/.DS_Store' 'local.properties'
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_1710261751-1_APK
          path: Desktop/AldanmazDrive_1710261751-1.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_1710261751-1_ZIP
          path: Desktop/AldanmazDrive_1710261751-1.zip
          if-no-files-found: error
          retention-days: 30
