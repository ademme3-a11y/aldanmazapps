name: Inspect 70mai rear stream switch
on:
  push:
    branches:
      - feature/70mai-rear-camera-switch
    paths:
      - '.github/workflows/inspect-70mai-rear-switch.yml'
      - '70mai-analysis/assets.zip.part-*'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and inspect uploaded assets archive
        run: |
          set -e
          cat 70mai-analysis/assets.zip.part-aa 70mai-analysis/assets.zip.part-ab 70mai-analysis/assets.zip.part-ac > /tmp/70mai-assets.zip
          unzip -t /tmp/70mai-assets.zip
          mkdir -p /tmp/70mai-assets
          unzip -q /tmp/70mai-assets.zip -d /tmp/70mai-assets
          {
            echo '=== ARCHIVE CONTENTS ==='
            find /tmp/70mai-assets -type f -printf '%p %s bytes\n' | sort | head -10000
            echo '=== MATCHING TEXT IN ALL ASSETS ==='
            find /tmp/70mai-assets -type f -size -100M -print0 |
              while IFS= read -r -d '' f; do
                strings -n 5 "$f" 2>/dev/null |
                  grep -Ei 'setwifistream|signkey|connectKey|mult_cam_back|mult_cam_front|livestream|camera.?switch|rear.?camera|back.?camera|sensor[=:][01]' &&
                  echo " [FILE: $f]" || true
              done
            echo '=== FLUTTER / DART / NATIVE FILES ==='
            find /tmp/70mai-assets -type f |
              grep -Ei '\.(so|dill|snapshot|blob|dat|json|js|bundle|bin)$|flutter|kernel' || true
            echo '=== NATIVE ASSETS MANIFEST ==='
            cat /tmp/70mai-assets/assets/flutter_assets/NativeAssetsManifest.json || true
            echo
            echo '=== 70MAI DEVICE CONFIG MATCHES ==='
            grep -Ein -C 3 'DR2821|DR2820|A800|camera|stream|sensor|rtsp|wifi|command|channel|rear|back|front' /tmp/70mai-assets/assets/70mai_device.json | head -500 || true
            echo '=== APP CONFIG ==='
            cat /tmp/70mai-assets/assets/config/app_config.json || true
            echo
            echo '=== RELEVANT FLUTTER ASSET NAMES ==='
            find /tmp/70mai-assets/assets/flutter_assets/packages/flutter_70mai_dashcam -type f |
              grep -Ei 'camera|player|stream|video|rear|back|front|multi|wifi|live' | sort || true
          } > 70mai-analysis/assets-inspection-report.txt
      - name: Install JADX
        run: |
          curl -L --fail --retry 3 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.2/jadx-1.5.2.zip
          mkdir -p /opt/jadx
          unzip -q /tmp/jadx.zip -d /opt/jadx
          chmod +x /opt/jadx/bin/jadx
      - name: Decompile and search DEX
        run: |
          mkdir -p /tmp/70mai-src
          jadx --deobf --show-bad-code -d /tmp/70mai-src 70mai-analysis/classes2.dex || true
          R=70mai-analysis/rear-switch-focused-report.txt
          {
            echo '=== EXACT COMMAND / SIGNATURE REFERENCES IN DECOMPILED SOURCES ==='
            grep -RinE -C 12 'setwifistream|signkey|connectKey|mult_cam_back|mult_cam_front|sensor[=:]0|sensor[=:]1|livestream' /tmp/70mai-src/sources /tmp/70mai-src/resources 2>/dev/null | head -12000 || true
            echo '=== EXACT STRINGS IN DEX FILES ==='
            for f in 70mai-analysis/classes.dex 70mai-analysis/classes2.dex; do
              echo "--- $f ---"
              strings -n 4 "$f" | grep -Ei 'setwifistream|signkey|connectKey|mult_cam_back|mult_cam_front|livestream|sensor|rear|back.?camera|front.?camera|camera.?switch|sign.?key|timestamp' | sort -u | head -2000 || true
            done
            echo '=== ALL DEX STRINGS RELATED TO CAMERA / FLUTTER / NETWORK / COMMAND ==='
            for f in 70mai-analysis/classes.dex 70mai-analysis/classes2.dex; do
              echo "--- $f ---"
              strings -n 3 "$f" | grep -Ei 'camera|camcorder|dashcam|rear|front|backcam|back_cam|stream|rtsp|wifi|channel|methodcall|flutter|invokeMethod|http|cgi|sensor|connectkey|signkey|timestamp|command|video|player|multi' | sort -fu | head -6000 || true
            done
            echo '=== DECOMPILED CAMERA / FLUTTER PLUGIN REFERENCES ==='
            grep -RinE -C 10 'Flutter70maiBasePlugin|MIDRIVE_CHANNEL|deviceChannel|methodChannel|invokeMethod|setMethodCallHandler|createPlayer|setLiveVideo|setVideoPalyerActivity|rtsp|stream|camera' /tmp/70mai-src/sources 2>/dev/null | head -18000 || true
            echo '=== DECOMPILED CLASS FILES ==='
            find /tmp/70mai-src/sources -type f -name '*.java' | head -300 || true
            echo '=== INPUT FILES ==='
            find 70mai-analysis -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
            echo '=== DECOMPILE SUMMARY ==='
            find /tmp/70mai-src/sources -type f -name '*.java' | wc -l
          } > "$R"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add 70mai-analysis/assets-inspection-report.txt "$R"
          git commit -m "Inspect uploaded 70mai assets archive" || true
          git push
