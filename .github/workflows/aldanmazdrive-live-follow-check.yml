name: Aldanmaz Drive Live Follow Build

on:
  push:
    branches: [feature/bidirectional-live-follow]
    paths:
      - 'Desktop/AldanmazDrive_143_github_hazir/**'
      - '.github/workflows/aldanmazdrive-live-follow-check.yml'
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Desktop/AldanmazDrive_143_github_hazir
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_1610261600-1
          path: Desktop/AldanmazDrive_143_github_hazir/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
