name: Aldanmaz Drive 144 Debug Build
on:
  push:
    branches: [main]
    paths:
      - 'Desktop/AldanmazDrive_144_github_hazir/**'
      - '.github/workflows/aldanmazdrive-144-debug.yml'
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Desktop/AldanmazDrive_144_github_hazir
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Create source ZIP
        run: zip -r ../AldanmazDrive_144.zip . -x '.gradle/*' 'app/build/*' '**/.DS_Store'
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_144_Debug_APK
          path: Desktop/AldanmazDrive_144_github_hazir/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload 144 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_144_ZIP
          path: Desktop/AldanmazDrive_144.zip
          if-no-files-found: error
          retention-days: 30
