name: Aldanmaz Drive 165 Debug Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Desktop/AldanmazDrive_147_github_hazir
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify permanent signing key
        run: |
          test -s app/aldanmaz-debug.keystore || { echo "Permanent signing keystore is missing."; exit 1; }
          keytool -list -keystore app/aldanmaz-debug.keystore -storepass android -alias androiddebugkey >/dev/null
      - name: Configure TomTom API key
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          test -n "$TOMTOM_API_KEY" || { echo "TOMTOM_API_KEY secret is missing."; exit 1; }
          printf 'TOMTOM_API_KEY=%s\n' "$TOMTOM_API_KEY" > local.properties
          echo "TomTom key is present."
      - name: Set version 165
        run: |
          sed -i 's/versionCode = 203/versionCode = 204/; s/versionName = "164"/versionName = "165"/' app/build.gradle.kts
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK signing
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../AldanmazDrive_165.apk
      - name: Create source ZIP
        run: zip -r ../AldanmazDrive_165.zip . -x '.gradle/*' 'app/build/*' '**/.DS_Store' 'local.properties'
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_165_APK
          path: Desktop/AldanmazDrive_165.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_165_ZIP
          path: Desktop/AldanmazDrive_165.zip
          if-no-files-found: error
          retention-days: 30

