name: Aldanmaz Drive 146 Debug Build
# 146 stable-signing retry
on:
  push:
    branches: [main]
    paths:
      - 'Desktop/AldanmazDrive_146_github_hazir/**'
      - '.github/workflows/aldanmazdrive-146-debug.yml'
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Desktop/AldanmazDrive_146_github_hazir
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure TomTom API key
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          if [ -z "$TOMTOM_API_KEY" ]; then
            echo "TOMTOM_API_KEY GitHub Actions secret is missing."
            exit 1
          fi
          printf 'TOMTOM_API_KEY=%s\n' "$TOMTOM_API_KEY" > local.properties
      - name: Restore stable debug signing key
        id: debug-signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aldanmazdrive-debug-signing-v1

      - name: Create stable debug signing key when missing
        if: steps.debug-signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v             -keystore ~/.android/debug.keystore             -storepass android             -keypass android             -alias androiddebugkey             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"

      - name: Save stable debug signing key
        if: steps.debug-signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: aldanmazdrive-debug-signing-v1

      - name: Verify stable debug signing key
        run: |
          keytool -list -keystore ~/.android/debug.keystore             -storepass android -alias androiddebugkey >/dev/null
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Create source ZIP
        run: zip -r ../AldanmazDrive_146.zip . -x '.gradle/*' 'app/build/*' 'local.properties' '**/.DS_Store'
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_146_Debug_APK
          path: Desktop/AldanmazDrive_146_github_hazir/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload 146 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_146_ZIP
          path: Desktop/AldanmazDrive_146.zip
          if-no-files-found: error
          retention-days: 30
