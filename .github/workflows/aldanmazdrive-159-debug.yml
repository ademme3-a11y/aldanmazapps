name: Aldanmaz Drive 159 Debug Build

on:
  push:
    branches: [main]
    paths:
      - 'Desktop/AldanmazDrive_147_github_hazir/**'
      - '.github/workflows/aldanmazdrive-159-debug.yml'
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Desktop/AldanmazDrive_147_github_hazir
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure stable debug signing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure speed limit API keys
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
        run: |
          test -n "$TOMTOM_API_KEY" || { echo "TOMTOM_API_KEY secret is missing."; exit 1; }
          printf 'TOMTOM_API_KEY=%s\n' "$TOMTOM_API_KEY" > local.properties
          printf 'HERE_API_KEY=%s\n' "$HERE_API_KEY" >> local.properties
          echo "TomTom key is present; HERE key is optional and is not printed."

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../AldanmazDrive_159.apk

      - name: Create source ZIP
        run: zip -r ../AldanmazDrive_159.zip . -x '.gradle/*' 'app/build/*' '**/.DS_Store' 'local.properties'

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_159_APK
          path: Desktop/AldanmazDrive_159.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_159_ZIP
          path: Desktop/AldanmazDrive_159.zip
          if-no-files-found: error
          retention-days: 30
