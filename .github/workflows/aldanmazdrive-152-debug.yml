name: Aldanmaz Drive 152 Debug Build

on:
  push:
    branches: [main]
    paths:
      - 'Desktop/AldanmazDrive_147_github_hazir/**'
      - '.github/workflows/aldanmazdrive-152-debug.yml'
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Desktop/AldanmazDrive_147_github_hazir
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable debug signing key
        run: |
          mkdir -p ~/.android
          cp app/aldanmaz-debug.keystore ~/.android/debug.keystore

      - name: Detect stable debug keystore credentials
        shell: bash
        run: |
          set -e
          KEYSTORE="$GITHUB_WORKSPACE/Desktop/AldanmazDrive_147_github_hazir/app/aldanmaz-debug.keystore"
          ALIAS="androiddebugkey"
          candidates=(android aldanmaz aldanmazdebug aldanmazdrive AldanmazDrive AldanmazDebug 123456 12345678 admin password)
          store_pass=""
          for p in "${candidates[@]}"; do
            if keytool -list -keystore "$KEYSTORE" -storepass "$p" -alias "$ALIAS" >/dev/null 2>&1; then
              store_pass="$p"
              break
            fi
          done
          if [ -z "$store_pass" ]; then
            echo "Stable keystore password was not found among the known project credentials." >&2
            exit 1
          fi
          key_pass=""
          for p in "${candidates[@]}"; do
            cp "$KEYSTORE" "$RUNNER_TEMP/test-debug.keystore"
            if keytool -keypasswd -alias "$ALIAS" -keystore "$RUNNER_TEMP/test-debug.keystore" -storepass "$store_pass" -keypass "$p" -new "$p" >/dev/null 2>&1; then
              key_pass="$p"
              break
            fi
          done
          if [ -z "$key_pass" ]; then
            echo "Stable private-key password was not found among the known project credentials." >&2
            exit 1
          fi
          echo "ALDANMAZ_KEYSTORE_PASSWORD=$store_pass" >> "$GITHUB_ENV"
          echo "ALDANMAZ_KEY_PASSWORD=$key_pass" >> "$GITHUB_ENV"
          echo "ALDANMAZ_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Create source ZIP
        run: zip -r ../AldanmazDrive_152.zip . -x '.gradle/*' 'app/build/*' '**/.DS_Store'

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_152_Debug_APK
          path: Desktop/AldanmazDrive_147_github_hazir/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_152_ZIP
          path: Desktop/AldanmazDrive_152.zip
          if-no-files-found: error
          retention-days: 30
