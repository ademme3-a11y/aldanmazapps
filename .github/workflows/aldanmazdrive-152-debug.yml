name: Aldanmaz Drive 152 Debug Build

on:
  push:
    branches: [main]
    paths:
      - 'Desktop/AldanmazDrive_147_github_hazir/**'
      - '.github/workflows/aldanmazdrive-152-debug.yml'
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Desktop/AldanmazDrive_147_github_hazir
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable debug signing key
        id: debug-signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aldanmazdrive-debug-signing-v1

      - name: Require existing stable debug signing key
        if: steps.debug-signing-cache.outputs.cache-hit != 'true'
        run: |
          echo "Stable debug signing key cache is missing. Refusing to build a differently signed APK."
          exit 1

      - name: Verify stable debug signing key
        run: |
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Configure TomTom API key
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM2 }}
        run: |
          test -n "$TOMTOM_API_KEY" || { echo "TOMTOM2 GitHub secret is missing."; exit 1; }
          printf 'TOMTOM_API_KEY=%s\n' "$TOMTOM_API_KEY" > local.properties
          echo "TomTom key is configured."

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Create source ZIP
        run: zip -r ../AldanmazDrive_152.zip . -x '.gradle/*' 'app/build/*' '**/.DS_Store' 'local.properties'

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_152_Debug_APK
          path: Desktop/AldanmazDrive_147_github_hazir/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_152_ZIP
          path: Desktop/AldanmazDrive_152.zip
          if-no-files-found: error
          retention-days: 30
