name: Analyze 70mai DEX
on:
  push:
    branches:
      - feature/70mai-rear-camera-switch
    paths:
      - '.github/workflows/analyze-70mai.yml'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install JADX
        run: |
          curl -L --fail --retry 3 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.2/jadx-1.5.2.zip
          mkdir -p /opt/jadx
          unzip -q /tmp/jadx.zip -d /opt/jadx
          chmod +x /opt/jadx/bin/jadx
          echo "/opt/jadx/bin" >> "$GITHUB_PATH"
      - name: Decompile and inspect camera code
        run: |
          jadx --deobf --show-bad-code -d /tmp/70mai-src 70mai-analysis/classes.dex 70mai-analysis/classes2.dex || true
          echo "===== CAMERA / REARVIEW SOURCE FILES ====="
          find /tmp/70mai-src/sources -type f | grep -Ei 'camera|rear|dashcam|preview|video|device|p2p' | head -250 || true
          echo "===== REARVIEW MODEL AND CAMERA CONTROL REFERENCES ====="
          grep -RinE -C 5 'RearviewDashCam|RearviewMirror|RearView|rearview|RearCamera|rearCamera|rear_camera|cameraSwitch|switchCamera|setCamera|Camera.{0,25}(type|mode|channel|index)|channel.{0,25}(camera|video)|av5|subStream|sub_stream|videoChannel|streamType|startPreview|preview.{0,25}(camera|stream)' /tmp/70mai-src/sources 2>/dev/null | head -2200 || true
          echo "===== CAMERA PACKAGE CLASS NAMES ====="
          grep -RilE 'RearviewDashCam|RearviewMirror|rearview|cameraSwitch|switchCamera|startPreview|av5' /tmp/70mai-src/sources 2>/dev/null | head -150 || true
