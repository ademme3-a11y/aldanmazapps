name: Analyze 70mai DEX
on:
  push:
    branches:
      - feature/70mai-rear-camera-switch
    paths:
      - '.github/workflows/analyze-70mai.yml'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JADX
        run: |
          curl -L --fail --retry 3 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.2/jadx-1.5.2.zip
          mkdir -p /opt/jadx && unzip -q /tmp/jadx.zip -d /opt/jadx
          chmod +x /opt/jadx/bin/jadx
          echo "/opt/jadx/bin" >> "$GITHUB_PATH"
      - name: Decompile and inspect camera code
        run: |
          jadx --deobf --show-bad-code -d /tmp/70mai-src 70mai-analysis/classes.dex 70mai-analysis/classes2.dex || true
          echo "===== APP PACKAGE FILES ====="
          find /tmp/70mai-src/sources/com/banyac/midrive/app -type f | grep -Ei 'camera|preview|device|record|video|p2p|player|home|main|live' | head -300 || true
          echo "===== GROUP CATEGORY DEFINITION ====="
          grep -RinE -C 12 'enum GroupCategory|class GroupCategory|RearviewDashCam|RearviewMirror' /tmp/70mai-src/sources/com/banyac/midrive/app/model /tmp/70mai-src/sources/com/banyac/midrive/app 2>/dev/null | head -500 || true
          echo "===== CAMERA LABEL RESOURCE REFERENCES ====="
          grep -RinE -C 3 'rearview|rear_view|rear.?camera|back.?camera|switch.?camera|camera.?switch|dual.?channel|rear.?channel|后摄|后置|后视|后镜|后路' /tmp/70mai-src/resources /tmp/70mai-src/sources/com/banyac/midrive/app 2>/dev/null | head -1800 || true
          echo "===== APP MANIFEST ACTIVITIES AND SERVICES ====="
          grep -RinE 'activity|service|receiver|intent-filter|exported|permission' /tmp/70mai-src/resources/AndroidManifest.xml 2>/dev/null | head -500 || true
