name: Analyze 70mai DEX
on:
  push:
    branches:
      - feature/70mai-rear-camera-switch
    paths:
      - '.github/workflows/analyze-70mai.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JADX
        run: |
          curl -L --fail --retry 3 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.2/jadx-1.5.2.zip
          mkdir -p /opt/jadx && unzip -q /tmp/jadx.zip -d /opt/jadx
          chmod +x /opt/jadx/bin/jadx
          echo "/opt/jadx/bin" >> "$GITHUB_PATH"
      - name: Decompile and create inspection report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jadx --deobf --show-bad-code -d /tmp/70mai-src 70mai-analysis/classes.dex 70mai-analysis/classes2.dex || true
          R=70mai-analysis/inspection-report.txt
          {
            echo '=== CLASSES RELATED TO CAMERA / PREVIEW / DEVICE / P2P ==='
            find /tmp/70mai-src/sources/com/banyac -type f | grep -Ei 'camera|preview|device|record|video|p2p|player|live|stream|iotc' | head -600 || true
            echo '=== CAMERA / STREAM / CHANNEL CONTROL CALLS ==='
            grep -RinE -C 7 'getChannelId|setChannelId|getStreamTypes|startPreview|stopPreview|switch.*(camera|channel|stream)|camera.*switch|rear.*(camera|channel|stream)|channel.*(rear|camera)|stream.*(type|channel)|P2P|IOTC|Iotc|AVAPIs|avClient|connectDevice|deviceId|deviceType|preview' /tmp/70mai-src/sources/com/banyac 2>/dev/null | head -5000 || true
            echo '=== UI CLICK LISTENERS / CAMERA ACTIONS ==='
            grep -RinE -C 6 'setOnClickListener|onClick\(|onClick =|click.*(camera|preview)|camera.*(click|toggle)|video.*(click|toggle)' /tmp/70mai-src/sources/com/banyac/midrive/app 2>/dev/null | head -3000 || true
            echo '=== RESOURCE FILES ==='
            find /tmp/70mai-src/resources -type f | head -250 || true
            echo '=== STRING KEYS THAT MAY DESCRIBE REAR CAMERA ==='
            grep -RinE 'rear|back.?camera|dual.?channel|channel.?[12]|后摄|后置|后视|后镜' /tmp/70mai-src/resources 2>/dev/null | head -1000 || true
          } > "$R"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "$R"
          git commit -m "Add 70mai camera code inspection report" || true
          git push
