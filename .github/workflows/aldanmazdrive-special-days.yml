name: Aldanmaz Drive 1011262300-1 Special Days Build

on:
  push:
    branches: [feature/live-follow-147-preserved]
    paths:
      - 'Desktop/AldanmazDrive_147_github_hazir/**'
      - '.github/workflows/aldanmazdrive-special-days.yml'
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Desktop/AldanmazDrive_147_github_hazir
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify permanent signing key
        run: |
          test -s app/aldanmaz-debug.keystore || { echo "Permanent signing keystore is missing."; exit 1; }
          keytool -list -keystore app/aldanmaz-debug.keystore -storepass android -alias androiddebugkey >/dev/null
      - name: Configure TomTom API key
        env:
          TOMTOM2: ${{ secrets.TOMTOM2 }}
        run: |
          test -n "$TOMTOM2" || { echo "TOMTOM2 secret is missing."; exit 1; }
          printf 'TOMTOM_API_KEY=%s\\n' "$TOMTOM2" > local.properties
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify APK exists and signing
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../AldanmazDrive_1011262300-1.apk
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_1011262300-1_APK
          path: Desktop/AldanmazDrive_1011262300-1.apk
          if-no-files-found: error
          retention-days: 30
