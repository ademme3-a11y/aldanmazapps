name: Aldanmaz Drive 155 Debug Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Desktop/AldanmazDrive_147_github_hazir/**'
      - '.github/workflows/aldanmazdrive-155-debug.yml'

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Desktop/AldanmazDrive_147_github_hazir
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable debug signing key
        id: debug-signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aldanmazdrive-debug-signing-v1
      - name: Require existing stable debug signing key
        if: steps.debug-signing-cache.outputs.cache-hit != 'true'
        run: |
          echo "Stable debug signing key cache is missing. Refusing to build a differently signed APK."
          exit 1
      - name: Verify stable debug signing key
        run: |
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null
      - name: Configure TomTom API key
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          test -n "$TOMTOM_API_KEY" || { echo "TOMTOM_API_KEY secret is missing."; exit 1; }
          printf 'TOMTOM_API_KEY=%s\n' "$TOMTOM_API_KEY" > local.properties
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          test -x "$APKSIGNER" || { echo "apksigner not found in Android SDK build-tools."; exit 1; }
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../AldanmazDrive_155.apk
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_155_APK
          path: Desktop/AldanmazDrive_155.apk
          if-no-files-found: error
          retention-days: 30
