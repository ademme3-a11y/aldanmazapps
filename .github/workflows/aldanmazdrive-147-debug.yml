name: Aldanmaz Drive 147 Debug Build
# 147 stable-signing retry
on:
  push:
    branches: [main, gunduz-temasi]
    paths:
      - 'Desktop/AldanmazDrive_147_github_hazir/**'
      - '.github/workflows/aldanmazdrive-147-debug.yml'
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Desktop/AldanmazDrive_147_github_hazir
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure TomTom API key
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          if [ -z "$TOMTOM_API_KEY" ]; then
            echo "TOMTOM_API_KEY GitHub Actions secret is missing."
            exit 1
          fi
          printf 'TOMTOM_API_KEY=%s\n' "$TOMTOM_API_KEY" > local.properties
      - name: Restore stable debug signing key
        id: debug-signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aldanmazdrive-debug-signing-v1

      - name: Require existing stable debug signing key
        if: steps.debug-signing-cache.outputs.cache-hit != 'true'
        run: |
          echo "Stable debug signing key cache is missing. Refusing to build a differently signed APK."
          exit 1

      - name: Verify stable debug signing key
        run: |
          keytool -list -keystore ~/.android/debug.keystore             -storepass android -alias androiddebugkey >/dev/null
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Create source ZIP
        run: zip -r ../AldanmazDrive_147.zip . -x '.gradle/*' 'app/build/*' 'local.properties' '**/.DS_Store'
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_147_Debug_APK
          path: Desktop/AldanmazDrive_147_github_hazir/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload 147 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_147_ZIP
          path: Desktop/AldanmazDrive_147.zip
          if-no-files-found: error
          retention-days: 30
