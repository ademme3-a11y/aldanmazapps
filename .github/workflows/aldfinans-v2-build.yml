name: ALDFİNANS v2 Build and Tests

on:
  push:
    branches: [ feature/aldfinans-v2-correct-apk ]
    paths:
      - "ALDFINANS/**"
      - ".github/workflows/aldfinans-v2-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ALDFINANS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run parser unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ALDFINANS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build new AlD Finans APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aldfinans-v2-debug
          path: ALDFINANS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
