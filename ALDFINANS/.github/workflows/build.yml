name: ALDFİNANS Build

on:
  push:
    paths:
      - "ALDFINANS/**"
  pull_request:
    paths:
      - "ALDFINANS/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ALDFINANS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ALDFINANS-debug-apk
          path: ALDFINANS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
