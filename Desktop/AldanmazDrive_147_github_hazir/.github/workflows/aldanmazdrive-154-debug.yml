name: Aldanmaz Drive 2411261600-1 Debug Build

on:
  push:
    branches: [main, feature/live-follow-147-preserved]
    paths:
      - 'Desktop/AldanmazDrive_147_github_hazir/**'
      - 'Desktop/AldanmazDrive_147_github_hazir/.github/workflows/aldanmazdrive-154-debug.yml'
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Desktop/AldanmazDrive_147_github_hazir
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../AldanmazDrive_2411261600-1.apk

      - name: Create source ZIP
        run: zip -r ../AldanmazDrive_2411261600-1.zip . -x '.gradle/*' 'app/build/*' '**/.DS_Store'

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_2411261600-1_APK
          path: Desktop/AldanmazDrive_2411261600-1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AldanmazDrive_2411261600-1_ZIP
          path: Desktop/AldanmazDrive_2411261600-1.zip
          if-no-files-found: error
          retention-days: 30
