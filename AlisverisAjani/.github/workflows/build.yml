name: Build Alisveris Ajani V5
on:
  push:
    branches: [ shopping-agent-v5 ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AlisverisAjani
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AlisverisAjani-v5-debug
          path: AlisverisAjani/app/build/outputs/apk/debug/app-debug.apk
